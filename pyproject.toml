[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rfdetr-seg-intermediate"
version = "0.3.1"
description = "Memory-efficient RF-DETR with RFDETRSegIntermediate and xformers attention support"
authors = [{name = "Nathan Honn"}]
requires-python = "==3.12.*"
license = {text = "Apache License 2.0"}
readme = "README.md"
keywords = ["machine-learning", "deep-learning", "vision", "ML", "DL", "AI", "DETR", "RF-DETR"]

dependencies = [
    "accelerate>=1.12.0",
    "Cython>=3.0.11",
    "huggingface_hub>=1.4.1",
    "Jinja2==3.1.6",
    "matplotlib>=3.9.2",
    "numpy>=2.2.6",
    "opencv-python>=4.12.0.88",
    "opencv-python-headless>=4.10.0.84",
    "peft>=0.18.1",
    "pillow>=12.0.0",
    "pillow-avif-plugin<1.5.3",
    "polygraphy>=0.49.26",
    "pycocotools>=2.0.11",
    "pyDeprecate==0.4.0",
    "PyOpenGL>=3.1.7",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.1",
    "rf100vl>=1.1.0",
    "roboflow==1.2.13",
    "scipy>=1.14.1",
    "pydantic>=2.12.5",
    "pydantic_core>=2.41.5",
    "supervision>=0.27.0.post1",
    "sympy>=1.14.0",
    "tokenizers>=0.22.2",
    "torch==2.10.0",
    "torchvision>=0.25.0",
    "tqdm==4.67.3",
    "transformers==5.0.0",
    "triton>=3.0.0",
    "xformers>=0.0.35",
]

[tool.setuptools.packages.find]
include = ["rfdetr*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
rfdetr = ["py.typed", "models/backbone/dinov2_configs/*.json"]
